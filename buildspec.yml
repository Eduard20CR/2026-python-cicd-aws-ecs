version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: cronos-app
    AWS_ACCOUNT_ID: 123456789012
    AWS_DEFAULT_REGION: us-east-1
    TASK_DEFINITION_APP_NAME: cronos-app

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - echo AWS Account ID = $AWS_ACCOUNT_ID
      - echo AWS Region = $AWS_DEFAULT_REGION
      - echo Image Repository Name = $IMAGE_REPO_NAME
      - echo Task Definition App Name = $TASK_DEFINITION_APP_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-12)
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - echo "Commit:" $CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo "Using tag:" $COMMIT_HASH
      - echo "Image URI:" $IMAGE_URI
      - echo '[{"name":"'"$TASK_DEFINITION_APP_NAME"'","imageUri":"'"$IMAGE_URI:$COMMIT_HASH"'"}]' > imagedefinitions.json

  build:
    commands:
      - echo Build started on $(date)
      - echo Building the Docker image...
      - docker buildx build --platform linux/amd64 -t $IMAGE_REPO_NAME:$COMMIT_HASH --load .
      - docker tag $IMAGE_REPO_NAME:$COMMIT_HASH $IMAGE_URI:$COMMIT_HASH

  post_build:
    commands:
      - echo Build completed on $(date)
      - echo Pushing the Docker image...
      - docker push $IMAGE_URI:$COMMIT_HASH
  
artifacts:
  files:
    - imagedefinitions.json